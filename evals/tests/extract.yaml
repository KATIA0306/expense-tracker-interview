# Expense extraction tests: parse amount, date, category, description from receipt emails
# Used with prompt: Expense extraction

- description: "Extract - single receipt with clear total and date"
  prompts: ["Expense extraction"]
  vars:
    emails: |
      [
        {"id":"ex-1","from":"orders@coffee-shop.com","subject":"Your receipt #4421","date":"Wed, 22 Jan 2025 10:30:00 -0500","body":"Thank you for your order. Total: $12.75. Date: January 22, 2025. Card ending 4242."}
      ]
    expectedMinExpenses: 1
  assert:
    - type: javascript
      value: file://assertions/extract-assertions.js
      metric: extract_accuracy
    - type: javascript
      value: file://assertions/extract-amount-date-assertions.js
      threshold: 0.95

- description: "Extract - grocery receipt with multiple line items (single total)"
  prompts: ["Expense extraction"]
  vars:
    emails: |
      [
        {"id":"ex-2","from":"noreply@instacart.com","subject":"Your No Frills order confirmation","date":"Fri, 30 Jan 2026 14:55:58 +0000","body":"Your order is confirmed. Delivery today 1pm-4pm. Order total: $87.42. Items: milk, bread, eggs. Service fee may apply."}
      ]
    expectedMinExpenses: 1
  assert:
    - type: javascript
      value: file://assertions/extract-assertions.js
      metric: extract_accuracy
    - type: javascript
      value: file://assertions/extract-amount-date-assertions.js
      threshold: 0.95

- description: "Extract - valid category and YYYY-MM-DD date"
