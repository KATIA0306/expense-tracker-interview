# --- Tests from emailData_exercise.csv ---

# Reptilia: real CSV body has NO amount (invoice attached). Model should use 0 and parse date from RFC format.
- description: "Extract (CSV) - Reptilia Payment Confirmation (no amount in body - use 0)"
  prompts: ["Expense extraction"]
  vars:
    emails: |
      [
        {"id":"19c0276a5d30f977","from":"bookings.vaughan@reptilia.org","subject":"Payment Confirmation","date":"28 Jan 2026 02:37:31 +0000","body":"Order #: 9352 Thank you for your payment! A copy of your invoice is attached to this email for your records."}
      ]
    expectedMinExpenses: 1
    expectedAmount: 0
  assert:
    - type: javascript
      value: file://assertions/extract-assertions.js
      metric: extract_accuracy
    - type: javascript
      value: file://assertions/extract-amount-date-assertions.js
      threshold: 0.95

# Real CSV body format: "Total $ 11 99" (spaces) and "Total $13.55" - model must parse correctly
- description: "Extract (CSV) - Amazon order with total and date (real body format)"
  prompts: ["Expense extraction"]
  vars:
    emails: |
      [
        {"id":"19bd20ce7f5635d5","from":"Amazon.ca <auto-confirm@amazon.ca>","subject":"Ordered: Hefty Basics Freezer...","date":"Sun, 18 Jan 2026 17:00:18 +0000","body":"Thanks for your order, jane! Ordered Shipped Out for delivery Delivered Arriving tomorrow jane – Maple, Ontario Order # 701-7828946-9057041 View or edit order Hefty Basics Freezer Bags/Food Ba... Quantity: 1 $ 11 99 Total $13.55 ©2026 Amazon.com, Inc."}
      ]
    expectedMinExpenses: 1
    expectedAmount: 13.55
    expectedMerchant: "Amazon"
    expectedDate: "2026-01-18"
  assert:
    - type: javascript
      value: file://assertions/extract-assertions.js
      metric: extract_accuracy
    - type: javascript
      value: file://assertions/extract-amount-date-assertions.js
      threshold: 0.95

