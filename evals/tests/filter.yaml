# Email receipt filter tests: identify which emails contain receipts/transactions
# Used with prompt: Email receipt filter

- description: "Filter - single clear receipt email is identified"
  prompts: ["Email receipt filter"]
  vars:
    emailSummaries: |
      [
        {"id":"rec-001","from":"orders@amazon.com","subject":"Your Amazon.com order of \"Coffee\" has shipped","bodyPreview":"Order total: $24.99. Order date: January 15, 2025. Thank you for your purchase."}
      ]
    expectedReceiptIds: ["rec-001"]
  assert:
    - type: javascript
      value: file://assertions/filter-assertions.js
      metric: filter_accuracy

- description: "Filter - newsletter is excluded from receipts"
  prompts: ["Email receipt filter"]
  vars:
    emailSummaries: |
      [
        {"id":"news-001","from":"newsletter@retailer.com","subject":"Weekly deals inside!","bodyPreview":"Check out this week's tips and promotions. No purchase required. Click here to browse."}
      ]
    expectedNotReceiptIds: ["news-001"]
  assert:
    - type: javascript
      value: file://assertions/filter-assertions.js
      metric: filter_accuracy

- description: "Filter - mixed: one receipt, one newsletter"
  prompts: ["Email receipt filter"]
  vars:
    emailSummaries: |
      [
        {"id":"rec-002","from":"receipts@uber.com","subject":"Your trip receipt","bodyPreview":"Trip total $18.50. Payment completed. Thank you for riding with Uber."},
        {"id":"news-002","from":"marketing@store.com","subject":"Spring sale preview","bodyPreview":"Get early access to our spring sale. No purchase necessary."}
      ]
    expectedReceiptIds: ["rec-002"]
    expectedNotReceiptIds: ["news-002"]
  assert:
    - type: javascript
      value: file://assertions/filter-assertions.js
      metric: filter_accuracy

- description: "Filter - empty list when no receipts"
  prompts: ["Email receipt filter"]
  vars:
    emailSummaries: |
      [
        {"id":"evt-001","from":"events@meetup.com","subject":"Reminder: Meetup tomorrow","bodyPreview":"Your event is scheduled for tomorrow at 6pm. See you there!"}
      ]
    expectedNotReceiptIds: ["evt-001"]
  assert:
    - type: javascript
      value: file://assertions/filter-assertions.js
      metric: filter_accuracy

- description: "Filter - order statuses: only purchase confirmation is receipt, status updates are not"
  prompts: ["Email receipt filter"]
  vars:
    emailSummaries: |
      [
        {"id":"ord-conf","from":"orders@shop.com","subject":"Order confirmed - Order #12345","bodyPreview":"Thank you for your order. Total charged: $89.99. Order date: Feb 20, 2025."},
        {"id":"ord-proc","from":"orders@shop.com","subject":"Order #12345 has been processed","bodyPreview":"Your order is being prepared. No additional charge. We'll notify you when it ships."},
        {"id":"ord-ship","from":"orders@shop.com","subject":"Order #12345 has shipped","bodyPreview":"Your order is on its way. Track your package. Delivery by Feb 25."},
        {"id":"ord-deliv","from":"orders@shop.com","subject":"Order #12345 delivered","bodyPreview":"Your order was delivered. Hope you enjoy your purchase!"}
      ]
    expectedReceiptIds: ["ord-conf"]
    expectedNotReceiptIds: ["ord-proc", "ord-ship", "ord-deliv"]
  assert:
    - type: javascript
      value: file://assertions/filter-assertions.js
      metric: filter_accuracy

- description: "Filter - refund email is not an expense (should not be considered receipt)"
  prompts: ["Email receipt filter"]
  vars:
    emailSummaries: |
      [
        {"id":"ref-001","from":"refunds@store.com","subject":"Your refund of $45.00 has been processed","bodyPreview":"We've refunded $45.00 to your original payment method. Refund for Order #67890. You should see the amount within 5-7 business days."}
      ]
    expectedNotReceiptIds: ["ref-001"]
  assert:
    - type: javascript
      value: file://assertions/filter-assertions.js
      metric: filter_accuracy

